name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  frontend:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci --legacy-peer-deps

      - name: Generated bindings match the contracts submodule
        run: npm run check:bindings

      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

      - name: No production links to retired demo routes
        run: node scripts/check-demo-links.mjs

  perf:
    name: Lighthouse CI & Performance Budgets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci --legacy-peer-deps

      - name: Build production bundle
        run: npm run build
        env:
          NEXT_PUBLIC_STELLAR_RPC_URL: http://localhost:8787/rpc
          NEXT_PUBLIC_API_URL: http://localhost:8787

      - name: Run Lighthouse CI
        run: npm run perf:lhci

      - name: Upload Lighthouse reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-reports
          path: .lighthouseci/reports/
