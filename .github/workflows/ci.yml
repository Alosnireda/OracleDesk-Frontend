name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Generated bindings match the contracts submodule
        run: npm run check:bindings

      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

      - name: No production links to retired demo routes
        run: node scripts/check-demo-links.mjs
